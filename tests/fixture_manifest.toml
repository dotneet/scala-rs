# External compiler fixtures used by the focused compatibility measurements.
# Keep this file free of machine-local paths.  The scripts resolve `url` and
# `revision` below into SCALA_RS_FIXTURE_ROOT (or its /tmp default).  Scala
# toolchain paths are relative to SCALA_RS_TOOLCHAIN_ROOT (or /tmp)
# so one manifest controls every measure/run script without changing the
# established /tmp locations.
manifest_version = 1

[toolchain]
scala_version = "2.13.16"
scala_home = "scala-2.13.16"
scala_library = "scala-rs-lib/scala-library-2.13.16.jar"
scala_library_jar = "scala-rs-lib/scala-library-2.13.16.jar"
scala_launcher_library_jar = "scala-2.13.16/lib/scala-library.jar"
scala_compiler_jar = "scala-2.13.16/lib/scala-compiler.jar"
scala_reflect_jar = "scala-2.13.16/lib/scala-reflect.jar"
scalac_launcher = "scala-2.13.16/bin/scalac"

[cats]
url = "https://github.com/typelevel/cats.git"
revision = "32a50dcfad9d897459bb755c4b5a22b4c7bc745c"
source_count = 340
source_count_kernel = 95
source_count_core = 245
generated_count = 16
generated_state = "kernel/core managed sources"

